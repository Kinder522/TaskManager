<!DOCTYPE html>
<html lang="ru">
<head><title>Регистрация</title></head>
<body>
    <h2>Регистрация в TaskManager</h2>
    <form id="registerForm">
        <input type="text" id="username" placeholder="Логин" required><br><br>
        <input type="email" id="email" placeholder="Почта" required><br><br>
        <input type="password" id="password" placeholder="Пароль" required><br><br>
        <button type="submit">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="/auth/login">Войти</a></p>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Останавливаем обычную перезагрузку страницы

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value;
            // Отправляем чистый JSON на бэкенд, прямо как завтра в Реакте!
            const response = await fetch('api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username,email, password })
            });

            if (response.ok) {
                alert('Регистрация успешна! Переходим на страницу входа.');
                window.location.href = '/auth/login'; // Перенаправляем на логин
            } else {
                const errorData = await response.json();
                alert('Ошибка: ' + (errorData.detail || 'Что-то пошло не так'));
            }
        });
    </script>
</body>
</html>
